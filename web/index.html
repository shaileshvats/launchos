<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaunchOS - from idea to launch with AI agents</title>
  <meta name="description" content="LaunchOS: specialist AI agents collaborate in Switch rooms to take a business idea to a launch decision.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B5BD6'/%3E%3Cpath d='M16 6c4 3 6 7 6 11l-3 3h-6l-3-3c0-4 2-8 6-11z' fill='%23fff'/%3E%3Ccircle cx='16' cy='14' r='2' fill='%235B5BD6'/%3E%3Cpath d='M12 23l-2 3m10-3l2 3' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="topbar">
    <button type="button" id="nav-toggle" class="btn btn-ghost nav-toggle" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>Launches</span>
    </button>
    <a class="brand" href="#/new" aria-label="LaunchOS home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3.5 2.6 5 5.7 5 9l-2.5 2.5h-5L7 12c0-3.3 1.5-6.4 5-9z"/><path d="M9.5 17.5 8 21M14.5 17.5 16 21"/></svg>
      </span>
      <span class="brand-name">LaunchOS</span>
    </a>
    <span class="tagline">Idea to launch, run by agents in Switch rooms</span>
    <span id="mock-pill" class="pill pill-mock" hidden>Mock data</span>
    <a class="btn btn-primary" href="#/new">+ New launch</a>
  </header>

  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Launches">
      <div class="sidebar-head">
        <h2 class="sidebar-title">Launches</h2>
        <button type="button" id="refresh-launches" class="btn btn-ghost btn-sm" aria-label="Refresh launch list">Refresh</button>
      </div>
      <div id="launch-list-state" class="state" aria-live="polite"></div>
      <ul id="launch-list" class="launch-list"></ul>
    </aside>
    <div id="backdrop" class="backdrop" hidden></div>

    <main id="main" class="main" tabindex="-1">
      <noscript><p class="state state-error">LaunchOS needs JavaScript enabled.</p></noscript>
      <div id="view"></div>
    </main>
  </div>

  <footer class="healthbar" id="health" role="status" aria-live="polite" aria-label="System health">
    <span class="health-item muted">Checking system health...</span>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
